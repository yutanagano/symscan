[package]
name = "symscan-airr"
authors = ["Yuta Nagano"]
version.workspace = true
edition = "2021"
description = "Fast similarity measurement between adaptive immune receptor repertoire data, powered by symscan."
repository = "https://github.com/yutanagano/symscan"
homepage = "https://github.com/yutanagano/symscan"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
symscan = { version = "0.8", path = "../symscan/" }
rayon = "1.10"
csv = "1.4.0"
hashbrown = "0.16"
thiserror = "2.0.20"
itertools = "0.15.0"
foldhash = "0.2.0"

[[bin]]
name = "symscan-airr"
path = "src/main.rs"
